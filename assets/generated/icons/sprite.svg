<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Logo mark: a sun with eight rays -->
  <symbol id="i-sun" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="13"/>
    <g stroke="currentColor" stroke-width="5" stroke-linecap="round">
      <path d="M32 4v8M32 52v8M4 32h8M52 32h8M12.2 12.2l5.7 5.7M46.1 46.1l5.7 5.7M12.2 51.8l5.7-5.7M46.1 17.9l5.7-5.7"/>
    </g>
  </symbol>

  <!-- Service icons (24px line icons) -->
  <symbol id="i-heart" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
  <symbol id="i-pad" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10.5v4M5 12.5h4"/></g><circle cx="16" cy="11" r="1.3"/><circle cx="18" cy="14" r="1.3"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4" stroke-linecap="round"/></g></symbol>
  <symbol id="i-win" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4" stroke-linecap="round"/></g></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></g></symbol>
  <symbol id="i-lang" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h9M7.5 3v2M5 5c.8 3 2.8 5.5 6 7M10 5c-.8 3.5-3 6.2-6.5 8"/><path d="M13 21l4-9 4 9M14.5 18h5"/></g></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path stroke-linecap="round" d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g></symbol>
  <symbol id="i-in" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10.5" r="2.2"/><path stroke-linecap="round" d="M5.8 16.5c.6-1.8 1.8-2.7 3.2-2.7s2.6.9 3.2 2.7M14.5 10h4M14.5 13.5h3"/></g></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7l8 6 8-6"/></g></symbol>

  <!-- Hero art: sun with slowly turning rays and an orbit of small planets (games, apps, web) -->
  <symbol id="art-sun" viewBox="0 0 400 400">
    <defs>
      <radialGradient id="g-core" cx="45%" cy="40%" r="60%"><stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#fbbf24"/><stop offset="1" stop-color="#ea580c"/></radialGradient>
      <radialGradient id="g-glow" r="50%"><stop offset="0" stop-color="#f59e0b" stop-opacity=".45"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    </defs>
    <circle cx="200" cy="200" r="200" fill="url(#g-glow)"/>
    <g class="rays" fill="#f59e0b" opacity=".85">
      <path d="M200 30l9 52h-18zM200 370l-9-52h18zM30 200l52-9v18zM370 200l-52 9v-18zM79.8 79.8l43.1 30.4-12.7 12.7zM320.2 320.2l-43.1-30.4 12.7-12.7zM79.8 320.2l30.4-43.1 12.7 12.7zM320.2 79.8l-30.4 43.1-12.7-12.7z"/>
    </g>
    <circle cx="200" cy="200" r="150" fill="none" stroke="#f59e0b" stroke-opacity=".35" stroke-dasharray="4 10"/>
    <circle cx="200" cy="200" r="92" fill="url(#g-core)"/>
    <circle cx="200" cy="200" r="92" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
    <g class="orbit">
      <circle cx="200" cy="50" r="18" fill="#2b4c7e"/><path d="M193 50h14M200 43v14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="330" cy="275" r="15" fill="#e11d48"/><path d="M330 283s-7-4-7-9a3.5 3.5 0 0 1 7-1.5 3.5 3.5 0 0 1 7 1.5c0 5-7 9-7 9z" fill="#fff"/>
      <circle cx="70" cy="275" r="15" fill="#0d9488"/><rect x="64" y="267" width="12" height="16" rx="2.5" fill="none" stroke="#fff" stroke-width="2.5"/>
    </g>
  </symbol>

  <!-- Product art: RPG (night castle, moon and a sword) -->
  <symbol id="art-rpg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice">
    <circle cx="250" cy="45" r="22" fill="#fde68a"/><circle cx="259" cy="40" r="20" fill="#2a2150"/>
    <g fill="#fff" opacity=".7"><circle cx="40" cy="30" r="1.5"/><circle cx="90" cy="18" r="1"/><circle cx="150" cy="35" r="1.5"/><circle cx="200" cy="15" r="1"/><circle cx="290" cy="90" r="1"/></g>
    <path d="M0 180V130l40-20 50 14 60-30 70 26 50-16 50 22v54z" fill="#120f26"/>
    <path d="M110 180v-70h10v-12h8v12h14v-30l8-10 8 10v30h14v-12h8v12h10v70z" fill="#0b0918"/>
    <rect x="146" y="92" width="8" height="12" rx="4" fill="#f59e0b"/>
    <g transform="rotate(-35 225 120)"><rect x="221" y="70" width="8" height="70" rx="2" fill="#cbd5e1"/><rect x="210" y="138" width="30" height="6" rx="3" fill="#f59e0b"/><rect x="221" y="144" width="8" height="16" rx="2" fill="#7c2d12"/></g>
  </symbol>

  <!-- Product art: travel journal (map with pins and a footprint trail) -->
  <symbol id="art-trip" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice">
    <path d="M60 150l40-40 30 10 40-50 40 20 30-40 30 15" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
    <path d="M205 30c6-8 18-10 26-4 10 7 4 20-6 26l-10 34-14-6 6-30c-6-6-7-14-2-20z" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/>
    <g><path d="M100 104c-8 0-14-6-14-14s6-14 14-14 14 6 14 14c0 10-14 24-14 24" fill="#e11d48"/><circle cx="100" cy="90" r="5" fill="#fff"/></g>
    <g><path d="M170 64c-8 0-14-6-14-14s6-14 14-14 14 6 14 14c0 10-14 24-14 24" fill="#f59e0b"/><circle cx="170" cy="50" r="5" fill="#fff"/></g>
    <g><path d="M240 44c-6 0-10-4-10-10s4-10 10-10 10 4 10 10c0 7-10 17-10 17" fill="#0d9488"/><circle cx="240" cy="34" r="3.5" fill="#fff"/></g>
    <g fill="#64748b" opacity=".55"><ellipse cx="60" cy="150" rx="4" ry="6"/><ellipse cx="72" cy="138" rx="4" ry="6"/></g>
  </symbol>

  <!-- Product art: web (browser window with layout blocks) -->
  <symbol id="art-web" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice">
    <rect x="50" y="26" width="220" height="132" rx="12" fill="#fff" stroke="#c7d2fe" stroke-width="2"/>
    <path d="M50 38a12 12 0 0 1 12-12h196a12 12 0 0 1 12 12v8H50z" fill="#e0e7ff"/>
    <g fill="#fca5a5"><circle cx="64" cy="36" r="3.5"/></g><circle cx="76" cy="36" r="3.5" fill="#fcd34d"/><circle cx="88" cy="36" r="3.5" fill="#86efac"/>
    <rect x="66" y="58" width="110" height="12" rx="6" fill="#1c2333"/><rect x="66" y="78" width="80" height="8" rx="4" fill="#94a3b8"/>
    <rect x="66" y="96" width="54" height="16" rx="8" fill="#f59e0b"/>
    <rect x="190" y="56" width="64" height="58" rx="10" fill="#fde68a"/><circle cx="222" cy="85" r="14" fill="#f59e0b"/>
    <rect x="66" y="124" width="58" height="22" rx="6" fill="#eef2ff"/><rect x="131" y="124" width="58" height="22" rx="6" fill="#eef2ff"/><rect x="196" y="124" width="58" height="22" rx="6" fill="#eef2ff"/>
  </symbol>
</svg>
